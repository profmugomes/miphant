asar: true
files:
  - "!.git/**/*"
  - "!.github/**/*"
  - "!app/**/*"
  - "!php/**/*"
  - "!packages/**/*"
  - "!config-dev.sh"
  - "!config.sh"
  - "!compile.sh"
extraResources:
  - "./app/"
  - "./php/LICENSE"
  - "./php/php.ini"
  - "./LICENSE.md"
  - "./README.md"
win:
  artifactName: ${productName}-${version}-win.${ext}
  icon: icon/miphant.ico
  target:
    - "dir"
  extraResources:
   - from: "./php/php-cgi.exe"
     to: "php/php-cgi.exe"
linux:
  artifactName: ${productName}-${version}-linux.${ext}
  icon: icon/miphant.png
  target:
    - "dir"
  extraResources:
   - from: "./php/php-fpm"
     to: "php/php-fpm"
   - from: "./config.sh"
     to: "config.sh"
publish: null
